  <!-- ===================================================================
       1. SETTINGS - EDIT THIS BLOCK ONLY
       =================================================================== -->
  <script>
    window.LUNA_CONFIG = {
      // Paste your Firebase web-app config here
      // (Firebase Console -> Project settings -> Your apps -> Web app -> Config)
      firebaseConfig: {
        apiKey: "AIzaSyA-8GV3Jz2g8d47yIwQ4I_O4kTVtBsnkOo",
        authDomain: "luna-laboratory-assistance.firebaseapp.com",
        projectId: "luna-laboratory-assistance",
        storageBucket: "luna-laboratory-assistance.firebasestorage.app",
        messagingSenderId: "2814500942",
        appId: "1:2814500942:web:1420a8084caf0faff0e31f"
      },

      // Name of the data "folder" inside Firestore (any name you like)
      appId: "luna-app",

      // Built-in system administrator login (change these!)
      SYSTEM_ADMIN_USER: "labadmin",
      SYSTEM_ADMIN_PASS: "Luna#Lab2026!",

      // ===== STM32 SETTING (edit this 1 line) =====
      STM32_IP: "10.40.11.3"          // IP printed in the serial monitor (changes per hotspot)
    };

    // Same thing the STM32 page's LED form does: POST "radio=1" (LED on) or "radio=0" (LED off) to "/".
    // Never breaks the issue/return itself.
    window.lunaSendToStm32 = function (ledOn, note) {
      var url = "http://" + window.LUNA_CONFIG.STM32_IP + "/";
      var body = "radio=" + (ledOn ? "1" : "0");
      console.log("[LUNA->STM32] " + (note || "") + " POST " + url + " " + body);
      return fetch(url, {
        method: "POST",
        mode: "no-cors",
        cache: "no-store",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      })
        .then(function () { console.log("[LUNA->STM32] sent"); return true; })
        .catch(function (e) { console.warn("[LUNA->STM32] failed (blocked or unreachable)", e); return false; });
    };
  </script>

  <!-- Show any startup error on screen instead of a blank page -->
  <script>
    window.__lunaShowError = function (title, msg) {
      var root = document.getElementById('root');
      if (!root) return;
      root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:600px;margin:10vh auto;padding:24px;border:1px solid #fecaca;background:#fef2f2;border-radius:12px;color:#7f1d1d">' +
        '<h2 style="margin:0 0 8px;font-size:20px"></h2>' +
        '<p style="margin:0 0 8px;font-size:14px;white-space:pre-wrap;line-height:1.5"></p>' +
        '<p style="margin:0;font-size:13px;color:#991b1b">Open the browser console (F12) for details.</p></div>';
      root.querySelector('h2').textContent = title;
      root.querySelector('p').textContent = msg;
    };
    window.addEventListener('error', function (e) {
      if (!window.__lunaMounted) window.__lunaShowError('LUNA could not start', e.message || 'Unknown error');
    });
  </script>
